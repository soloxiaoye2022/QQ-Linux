---
name: qq

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release.yml
  schedule:
    - cron: 0 23 * * *

permissions: write-all

jobs:
  trigger:
    runs-on: ubuntu-latest
    name: trigger
    outputs:
      trigger: ${{ steps.check.outputs.trigger }}
      version: ${{ steps.check.outputs.version }}
      base: ${{ steps.check.outputs.base }}
    steps:
      - name: 从腾讯官方文档页解析最新版本
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 腾讯官方 Linux QQ 下载文档页，随版本更新替换内容。
          # 只依赖腾讯自有域名，不引入任何第三方仓库作为版本来源。
          DOC=https://docs.qq.com/doc/DVXNoRlpKaWhEY015
          curl -fsSL --retry 3 --retry-delay 5 --max-time 60 "$DOC" -o doc.html

          grep -oE 'https://qqdl\.gtimg\.cn/[^"<>\\ ]+linuxqq_[^"<>\\ ]+_amd64\.deb' doc.html \
            | sort -u > amd.txt
          if [ ! -s amd.txt ]; then
            echo "::error::未能从腾讯官方文档页解析出 amd64 下载地址"
            exit 1
          fi
          echo "解析到的 amd64 地址:"
          cat amd.txt

          # 同一文档页可能残留多个历史版本，取版本号最大的一条。
          AMD_URL=$(sed -E 's#.*/linuxqq_([0-9][^_]*)_amd64\.deb#\1 &#' amd.txt \
            | sort -V | tail -n 1 | cut -d' ' -f2)
          VERSION=$(basename "$AMD_URL" | sed -E 's/^linuxqq_(.+)_amd64\.deb$/\1/')
          BASE=$(dirname "$AMD_URL")

          echo "版本: $VERSION"
          echo "目录: $BASE"

          if gh api "/repos/${{ github.repository }}/releases/tags/$VERSION" > /dev/null 2>&1; then
            echo "trigger=false" >> "$GITHUB_OUTPUT"
            echo "跳过，本仓库已存在版本 $VERSION"
          else
            echo "trigger=true" >> "$GITHUB_OUTPUT"
            echo "需要发布版本 $VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

  build:
    needs: trigger
    if: needs.trigger.outputs.trigger == 'true'
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: 下载各架构安装包
        env:
          BASE: ${{ needs.trigger.outputs.base }}
          VERSION: ${{ needs.trigger.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p out

          # 必需架构：任一失败即中止，避免发布残缺版本
          REQUIRED="amd64.deb arm64.deb x86_64.rpm aarch64.rpm x86_64.AppImage arm64.AppImage loongarch64.deb"
          # 可选架构：官方部分版本不再提供，缺失时仅告警
          OPTIONAL="mips64el.deb"

          for a in $REQUIRED; do
            url="$BASE/linuxqq_${VERSION}_${a}"
            echo "下载 $url"
            curl -fsSL --retry 5 --retry-delay 10 --connect-timeout 30 \
              -o "out/linuxqq_${VERSION}_${a}" "$url"
          done

          for a in $OPTIONAL; do
            url="$BASE/linuxqq_${VERSION}_${a}"
            if curl -fsSL --retry 2 --retry-delay 5 --connect-timeout 30 \
                 -o "out/linuxqq_${VERSION}_${a}" "$url"; then
              echo "可选架构 $a 已获取"
            else
              echo "::warning::可选架构 $a 在该版本未发布，跳过"
              rm -f "out/linuxqq_${VERSION}_${a}"
            fi
          done

          ls -lh out

      - name: 校验安装包完整性
        env:
          VERSION: ${{ needs.trigger.outputs.version }}
        run: |
          set -euo pipefail
          # 腾讯官方不发布校验摘要，此处做结构完整性校验：
          # deb 必须含 ar 魔数，rpm 必须含 rpm 魔数，AppImage 必须可执行。
          check_deb() {
            magic=$(head -c 8 "$1" | tr -d '\0')
            if [ "$magic" != "!<arch>" ]; then
              echo "::error::$1 不是有效的 deb 包"
              return 1
            fi
            echo "$1 结构校验通过"
          }
          check_rpm() {
            magic=$(head -c 4 "$1" | od -An -tx1 | tr -d ' \n')
            if [ "$magic" != "edabeedb" ]; then
              echo "::error::$1 不是有效的 rpm 包"
              return 1
            fi
            echo "$1 结构校验通过"
          }
          check_appimage() {
            if [ ! -s "$1" ]; then
              echo "::error::$1 为空文件"
              return 1
            fi
            if ! head -c 64 "$1" | grep -qa 'ELF'; then
              echo "::error::$1 不是有效的 ELF 文件"
              return 1
            fi
            echo "$1 结构校验通过"
          }

          check_deb "out/linuxqq_${VERSION}_amd64.deb"
          check_deb "out/linuxqq_${VERSION}_arm64.deb"
          check_deb "out/linuxqq_${VERSION}_loongarch64.deb"
          check_rpm "out/linuxqq_${VERSION}_x86_64.rpm"
          check_rpm "out/linuxqq_${VERSION}_aarch64.rpm"
          check_appimage "out/linuxqq_${VERSION}_x86_64.AppImage"
          check_appimage "out/linuxqq_${VERSION}_arm64.AppImage"
          if [ -f "out/linuxqq_${VERSION}_mips64el.deb" ]; then
            check_deb "out/linuxqq_${VERSION}_mips64el.deb"
          fi

      - name: 重命名为统一格式
        env:
          VERSION: ${{ needs.trigger.outputs.version }}
        run: |
          set -euo pipefail
          cd out
          for file in linuxqq_*; do
            rest="${file#linuxqq_${VERSION}_}"
            arch="${rest%.*}"
            ext="${rest##*.}"
            case "$arch" in
              x86_64) arch=amd64 ;;
              aarch64) arch=arm64 ;;
            esac
            mv "$file" "QQ-${VERSION}-${arch}.${ext}"
          done
          ls -lh

      - name: 生成 amd64 tar.xz 归档
        env:
          VERSION: ${{ needs.trigger.outputs.version }}
        run: |
          set -euo pipefail
          cd out
          chmod +x "QQ-${VERSION}-amd64.AppImage"
          ./QQ-${VERSION}-amd64.AppImage --appimage-extract > /dev/null
          mv squashfs-root qq
          tar -cJf "QQ-${VERSION}-amd64.tar.xz" qq
          rm -rf qq
          ls -lh

      - name: 生成校验文件与发布说明
        env:
          VERSION: ${{ needs.trigger.outputs.version }}
        run: |
          set -euo pipefail
          cd out
          sha1sum QQ-* > SHA1SUMS
          sha256sum QQ-* > SHA256SUMS
          {
            echo '## SHA256 Checksums'
            echo '```'
            cat SHA256SUMS
            echo '```'
            echo ''
            echo '## SHA1 Checksums'
            echo '```'
            cat SHA1SUMS
            echo '```'
          } > ../note.md
          cat ../note.md

      - name: 发布
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.trigger.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$VERSION" --repo "${{ github.repository }}" \
            --title "QQ Linux ${VERSION}" --notes-file note.md || true
          gh release upload "$VERSION" out/QQ* --repo "${{ github.repository }}" --clobber
          gh release upload "$VERSION" out/SHA1SUMS out/SHA256SUMS --repo "${{ github.repository }}" --clobber

  # https://github.com/liskin/gh-workflow-keepalive
  keepalive:
    if: github.event_name == 'schedule'
    name: Keepalive
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Re-enable workflow
        run: |
          case "${GITHUB_WORKFLOW_REF:?}" in
          "${GITHUB_REPOSITORY:?}"/.github/workflows/*.y*ml@*) ;;
          *) false ;;
          esac
          workflow="${GITHUB_WORKFLOW_REF%%@*}"
          workflow="${workflow#${GITHUB_REPOSITORY}/.github/workflows/}"
          echo "Re-enable $workflow"
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/enable"
