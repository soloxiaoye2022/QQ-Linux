---
name: probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe tencent cdn
        run: |
          set -x
          for u in \
            "https://qqdl.gtimg.cn/qqfile/QQNT/9.9.35/beta/1763096b/linuxqq_3.2.33-52892_amd64.deb" \
            "https://qqdl.gtimg.cn/qqfile/QQNT/9.9.36/beta/9ee04bef/linuxqq_3.2.34-53644_amd64.deb" \
            "https://qqdl.gtimg.cn/qqfile/QQNT/9.9.37/beta/816b3c79/linuxqq_3.2.35-54395_amd64.deb" \
            "https://qqdl.gtimg.cn/qqfile/QQNTV2/9.9.31/release/00e6a3e7/QQ_3.2.29_260528_amd64_01.deb" \
            "https://dldir1v6.qq.com/qqfile/qq/QQNT/Linux/QQ_3.2.26_260319_amd64_01.deb" ; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -I --max-time 30 "$u")
            echo "PROBE $code $u"
          done
          echo "--- ip ---"
          curl -s --max-time 20 https://ipinfo.io/json || true
