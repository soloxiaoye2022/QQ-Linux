---
name: probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 腾讯官方 linuxConfig.js
        run: |
          set -uo pipefail
          echo "===== linuxConfig.js ====="
          if curl -fsSL --max-time 30 \
            https://cdn-go.cn/qq-web/im.qq.com_new/latest/rainbow/linuxConfig.js -o cfg.js; then
            cat cfg.js
            echo "----- 提取 URL -----"
            grep -oE 'https://[^"]+\.(deb|rpm|AppImage)' cfg.js | sort -u | tee urls.txt
            echo "----- 逐个探测 -----"
            while read -r u; do
              code=$(curl -s -o /dev/null -w '%{http_code}' -r 0-1023 --max-time 30 "$u")
              echo "PROBE $code $u"
            done < urls.txt
          else
            echo "FAIL 无法获取 linuxConfig.js"
          fi

      - name: 腾讯官方文档页
        run: |
          set -uo pipefail
          echo "===== docs.qq.com ====="
          if curl -fsSL --max-time 60 \
            https://docs.qq.com/doc/DVXNoRlpKaWhEY015 -o doc.html; then
            echo "页面大小: $(stat -c%s doc.html)"
            grep -oE 'https://qqdl\.gtimg\.cn/[^"<>\\ ]+linuxqq[^"<>\\ ]*' doc.html | sort -u | tee durls.txt
            echo "----- 逐个探测 -----"
            while read -r u; do
              code=$(curl -s -o /dev/null -w '%{http_code}' -r 0-1023 --max-time 30 "$u")
              echo "PROBE $code $u"
            done < durls.txt
          else
            echo "FAIL 无法获取文档页"
          fi

      - name: 对比 flathub 清单
        run: |
          set -uo pipefail
          echo "===== flathub ====="
          curl -fsSL --max-time 30 \
            https://raw.githubusercontent.com/flathub/com.qq.QQ/master/com.qq.QQ.yaml \
            | grep -oE 'https://qqdl\.gtimg\.cn/[^ ]*linuxqq_[^ ]*' | sort -u
