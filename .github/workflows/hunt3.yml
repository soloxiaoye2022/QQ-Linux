---
name: hunt3

on:
  workflow_dispatch:

jobs:
  cn:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: AUR 与 Arch 镜像
        run: |
          set -uo pipefail
          echo "=== AUR linuxqq 历史 ==="
          curl -s --max-time 30 "https://aur.archlinux.org/rpc/v5/info?arg[]=linuxqq" | head -c 2000
          echo ""
          echo "=== archlinuxcn 目录 ==="
          curl -s --max-time 40 "https://mirror.archlinuxcn.org/x86_64/" | grep -oE 'linuxqq[^"<> ]*' | sort -u | head -20
          echo "=== USTC archlinuxcn ==="
          curl -s --max-time 40 "https://mirrors.ustc.edu.cn/archlinuxcn/x86_64/" | grep -oE 'linuxqq[^"<> ]*' | sort -u | head -20

      - name: 国内发行版仓库
        run: |
          set -uo pipefail
          for u in \
            "https://mirrors.ustc.edu.cn/deepin/pool/main/l/linuxqq/" \
            "https://mirrors.tuna.tsinghua.edu.cn/deepin/pool/main/l/linuxqq/" \
            "https://mirrors.aliyun.com/deepin/pool/main/l/linuxqq/" \
            "https://mirrors.163.com/deepin/pool/main/l/linuxqq/" \
            "https://mirrors.huaweicloud.com/deepin/pool/main/l/linuxqq/" \
            "https://mirrors.sdu.edu.cn/spark-store-repository/store/chat/linuxqq/" \
            "https://software.openkylin.top/openkylin/yangtze/pool/main/deb/linuxqq/" \
            ; do
            echo "=== $u ==="
            curl -s --max-time 25 "$u" | grep -oE '[a-zA-Z0-9_.-]*linuxqq[^"<> ]*' | sort -u | head -15
          done

      - name: 麒麟与统信仓库
        run: |
          set -uo pipefail
          for u in \
            "https://update.cs2c.com.cn/NS/V10/V10SP1/os/adv/lic/base/x86_64/Packages/" \
            "https://archive.ubuntukylin.com/ubuntukylin/pool/main/l/linuxqq/" \
            "https://mirrors.aliyun.com/ubuntukylin/pool/main/l/linuxqq/" \
            ; do
            echo "=== $u ==="
            curl -s --max-time 25 "$u" | grep -oE '[a-zA-Z0-9_.-]*linuxqq[^"<> ]*' | sort -u | head -15
          done

      - name: 搜索引擎找 deb 直链
        run: |
          set -uo pipefail
          echo "=== bing 搜索 ==="
          curl -s --max-time 30 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
            "https://www.bing.com/search?q=%22QQ_3.2.26_260319%22" \
            | grep -oE 'https?://[^"<> ]*3\.2\.26[^"<> ]*' | sort -u | head -20
          echo "=== bing 搜 linuxqq 3.2.26 ==="
          curl -s --max-time 30 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
            "https://www.bing.com/search?q=linuxqq+3.2.26-260319+deb" \
            | grep -oE 'https?://[^"<> ]{10,120}' | grep -vE 'bing|microsoft|msn' | sort -u | head -25

      - name: 网盘与第三方归档
        run: |
          set -uo pipefail
          echo "=== sourceforge / 其它 ==="
          for u in \
            "https://sourceforge.net/projects/qq-linux-mirror/files/" \
            "https://mirrors.kernel.org/" \
            ; do
            c=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$u")
            echo "SITE $c $u"
          done
          echo "=== GitHub 全局搜索 3.2.26 deb ==="
          curl -s --max-time 30 "https://api.github.com/search/repositories?q=linuxqq+mirror&per_page=20" \
            | grep -oE '"full_name": "[^"]+"' | head -20
