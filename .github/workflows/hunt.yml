---
name: hunt

on:
  workflow_dispatch:

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 探测腾讯 CDN 各路径变体
        run: |
          set -uo pipefail
          V=3.2.26_260319
          N=3.2.26-260319
          HOSTS="qqdl.gtimg.cn dldir1.qq.com dldir1v6.qq.com"
          PATHS="/qqfile/qq/QQNT/Linux /qqfile/QQNT/Linux /qqfile/QQNT /qqfile/QQNTV2 /qqfile/qq/QQNTV2/Linux"
          NAMES="QQ_${V}_amd64_01.deb linuxqq_${N}_amd64.deb QQ_${V}_amd64.deb"
          for h in $HOSTS; do
            for p in $PATHS; do
              for n in $NAMES; do
                u="https://$h$p/$n"
                c=$(curl -s -o /dev/null -w '%{http_code}' -r 0-1023 --max-time 12 "$u")
                [ "$c" != "404" ] && echo "HIT $c $u"
              done
            done
          done
          echo "腾讯 CDN 扫描完成"

      - name: 探测国内镜像站
        run: |
          set -uo pipefail
          for u in \
            "https://mirrors.sdu.edu.cn/spark-store-repository/store/chat/linuxqq/linuxqq_3.2.26-260319_amd64.deb" \
            "https://mirrors.sdu.edu.cn/spark-store-repository/store/chat/linuxqq/QQ_3.2.26_260319_amd64_01.deb" \
            "https://software.openkylin.top/openkylin/yangtze/pool/main/deb/linuxqq/linuxqq_3.2.26-260319_amd64.deb" \
            "https://mirrors.ustc.edu.cn/deepin/pool/main/l/linuxqq/linuxqq_3.2.26-260319_amd64.deb" \
            "https://mirrors.tuna.tsinghua.edu.cn/deepin/pool/main/l/linuxqq/linuxqq_3.2.26-260319_amd64.deb" \
            "https://mirror.archlinuxcn.org/x86_64/linuxqq-3.2.26-260319-x86_64.pkg.tar.zst" \
            ; do
            c=$(curl -s -o /dev/null -w '%{http_code}' -I --max-time 15 "$u")
            echo "MIRROR $c $u"
          done
          echo "--- 山大 spark-store 目录 ---"
          curl -s --max-time 20 "https://mirrors.sdu.edu.cn/spark-store-repository/store/chat/linuxqq/" | grep -oE 'linuxqq[^"<> ]*\.(deb|AppImage)' | sort -u | head -40

      - name: 查询 archive.org
        run: |
          set -uo pipefail
          for u in \
            "dldir1v6.qq.com/qqfile/qq/QQNT/Linux/QQ_3.2.26_260319_amd64_01.deb" \
            "dldir1v6.qq.com/qqfile/qq/QQNT/Linux/QQ_3.2.26_260319_arm64_01.deb" \
            "dldir1v6.qq.com/qqfile/qq/QQNT/Linux/QQ_3.2.26_260319_x86_64_01.AppImage" \
            ; do
            echo "=== $u ==="
            curl -s --max-time 40 "http://archive.org/wayback/available?url=$u" || echo "查询失败"
            echo ""
          done
          echo "=== CDX 前缀查询 ==="
          curl -s --max-time 60 "https://web.archive.org/cdx/search/cdx?url=dldir1v6.qq.com/qqfile/qq/QQNT/Linux/*&output=text&fl=original,timestamp,statuscode&collapse=urlkey&limit=200" || echo "CDX 查询失败"

      - name: 查询腾讯历史配置存档
        run: |
          set -uo pipefail
          for u in \
            "https://im.qq.com/rainbow/linuxQQDownload" \
            "https://cdn-go.cn/qq-web/im.qq.com_new/latest/rainbow/linuxConfig.js" \
            "https://im.qq.com/rainbow/linuxConfig" \
            "https://cdn-go.cn/qq-web/im.qq.com_new/latest/rainbow/linuxQQDownload" \
            ; do
            echo "=== $u ==="
            curl -s --max-time 30 "$u" | grep -oE '3\.2\.[0-9]+[^"]{0,30}' | sort -u | head -5
          done
