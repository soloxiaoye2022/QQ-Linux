---
name: hunt5

on:
  workflow_dispatch:

jobs:
  mirrors:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 国内 deepin 系镜像（逐个限时）
        run: |
          set -uo pipefail
          for u in \
            "https://mirrors.aliyun.com/deepin/pool/main/l/linuxqq/" \
            "https://mirrors.huaweicloud.com/deepin/pool/main/l/linuxqq/" \
            "https://mirrors.163.com/deepin/pool/main/l/linuxqq/" \
            "https://mirrors.cloud.tencent.com/deepin/pool/main/l/linuxqq/" \
            "https://mirror.nju.edu.cn/deepin/pool/main/l/linuxqq/" \
            "https://mirrors.zju.edu.cn/deepin/pool/main/l/linuxqq/" \
            "https://mirrors.ustc.edu.cn/deepin/pool/main/l/linuxqq/" \
            "https://mirrors.tuna.tsinghua.edu.cn/deepin/pool/main/l/linuxqq/" \
            ; do
            echo "--- $u"
            timeout 18 curl -s "$u" 2>/dev/null | grep -oE 'linuxqq[^"<> ]*\.deb' | sort -u | head -10 || echo "  超时或无结果"
          done

      - name: archlinuxcn 镜像
        run: |
          set -uo pipefail
          for u in \
            "https://mirrors.ustc.edu.cn/archlinuxcn/x86_64/" \
            "https://mirrors.tuna.tsinghua.edu.cn/archlinuxcn/x86_64/" \
            "https://repo.archlinuxcn.org/x86_64/" \
            ; do
            echo "--- $u"
            timeout 25 curl -s "$u" 2>/dev/null | grep -oE 'linuxqq[^"<> ]*pkg[^"<> ]*' | sort -u | head -10 || echo "  超时或无结果"
          done

      - name: spark-store 与 openkylin 全量列表
        run: |
          set -uo pipefail
          echo "=== 山大 spark-store ==="
          timeout 25 curl -s "https://mirrors.sdu.edu.cn/spark-store-repository/store/chat/linuxqq/" 2>/dev/null | grep -oE 'linuxqq[^"<> ]*\.(deb|metal*|AppImage)' | sort -u || echo "失败"
          echo "=== openkylin 全目录 ==="
          for i in 1 2 3 4 5; do
            timeout 15 curl -s "https://software.openkylin.top/openkylin/yangtze/pool/main/deb/linuxqq/extra/$i/" 2>/dev/null | grep -oE 'linuxqq_3\.2\.2[0-9][^"<> ]*\.deb' | sort -u
          done || echo "失败"
